name: Release

# Builds the app archive and publishes it as a GitHub release, either
# - by pushing a tag like v0.3.1 that matches <version> in appinfo/info.xml, or
# - by starting this workflow by hand ("Run workflow"); it then tags the
#   current commit with the version from info.xml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match info.xml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build archive
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/stoffe-$VERSION.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Stoffe $VERSION" \
            --notes "Installation: siehe [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/v$VERSION/INSTALLATION.md). Archiv nach custom_apps/ entpacken und mit occ app:enable stoffe aktivieren."
