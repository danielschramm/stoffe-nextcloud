name: Release

# Push a tag like v0.3.1 (matching <version> in appinfo/info.xml) to build the
# app archive and publish it as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches info.xml version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match info.xml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build archive
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/stoffe-$VERSION.tar.gz" \
            --title "Stoffe $VERSION" \
            --notes "Installation: siehe [INSTALLATION.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/INSTALLATION.md). Archiv nach custom_apps/ entpacken und mit occ app:enable stoffe aktivieren." \
            --verify-tag
